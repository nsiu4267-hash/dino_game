<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Khủng Long</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f7f7f7;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    #game {
        width: 900px;
        max-width: 95%;
        height: 400px;
        background: white;
        border: 3px solid #333;
        position: relative;
        overflow: hidden;
    }

    #title {
        position: absolute;
        top: 15px;
        left: 20px;
        font-size: 24px;
        font-weight: bold;
    }

    #score {
        position: absolute;
        top: 18px;
        right: 25px;
        font-size: 20px;
    }

    #dinosaur {
        position: absolute;
        left: 80px;
        bottom: 55px;
        width: 45px;
        height: 55px;
        background: #333;
        border-radius: 8px 8px 3px 3px;
    }

    #dinosaur::before {
        content: "";
        position: absolute;
        width: 35px;
        height: 30px;
        background: #333;
        right: -22px;
        top: 5px;
        border-radius: 5px;
    }

    #dinosaur::after {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        background: white;
        right: -10px;
        top: 12px;
        border-radius: 50%;
    }

    .leg {
        position: absolute;
        width: 8px;
        height: 22px;
        background: #333;
        bottom: -15px;
    }

    .leg1 {
        left: 8px;
    }

    .leg2 {
        right: 8px;
    }

    #ground {
        position: absolute;
        left: 0;
        bottom: 50px;
        width: 100%;
        height: 4px;
        background: #333;
    }

    .cactus {
        position: absolute;
        bottom: 54px;
        right: -40px;
        width: 25px;
        height: 55px;
        background: #278a3a;
        border-radius: 5px 5px 0 0;
    }

    .cactus::before,
    .cactus::after {
        content: "";
        position: absolute;
        background: #278a3a;
        width: 15px;
        height: 25px;
        border-radius: 5px;
    }

    .cactus::before {
        left: -12px;
        top: 20px;
    }

    .cactus::after {
        right: -12px;
        top: 10px;
    }

    #message {
        position: absolute;
        width: 100%;
        text-align: center;
        top: 130px;
        font-size: 28px;
        font-weight: bold;
        display: none;
    }

    #help {
        position: absolute;
        bottom: 15px;
        width: 100%;
        text-align: center;
        color: #555;
    }
</style>
</head>

<body>

<div id="game">

    <div id="title">🦖 KHỦNG LONG MẤT MẠNG</div>

    <div id="score">
        Điểm: <span id="scoreNumber">0</span>
    </div>

    <div id="message">
        GAME OVER!<br>
<small>Nhấn SPACE để chơi lại</small>
    </div>

    <div id="dinosaur">
        <div class="leg leg1"></div>
        <div class="leg leg2"></div>
    </div>

    <div id="ground"></div>

    <div id="help">
        Nhấn PHÍM CÁCH để khủng long nhảy 🦖
    </div>

</div>

<script>
    const dinosaur = document.getElementById("dinosaur");
    const game = document.getElementById("game");
    const scoreNumber = document.getElementById("scoreNumber");
    const message = document.getElementById("message");

    let jumping = false;
    let gameOver = false;
    let score = 0;
    let speed = 6;

    let cactus = document.createElement("div");
    cactus.className = "cactus";
    game.appendChild(cactus);

    let cactusX = 900;

    function jump() {

        if (jumping || gameOver) {
            if (gameOver) restart();
            return;
        }

        jumping = true;

        let height = 0;

        let jumpUp = setInterval(function() {

            height += 7;
            dinosaur.style.bottom = (55 + height) + "px";

            if (height >= 130) {

                clearInterval(jumpUp);

                let jumpDown = setInterval(function() {

                    height -= 7;
                    dinosaur.style.bottom = (55 + height) + "px";

                    if (height <= 0) {

                        dinosaur.style.bottom = "55px";
                        clearInterval(jumpDown);
                        jumping = false;
                    }

                }, 20);
            }

        }, 20);
    }

    document.addEventListener("keydown", function(event) {

        if (event.code === "Space") {
            event.preventDefault();
            jump();
        }

    });

    game.addEventListener("click", function() {
        jump();
    });

    function gameLoop() {

        if (gameOver) return;

        cactusX -= speed;
        cactus.style.right = (900 - cactusX) + "px";

        if (cactusX < -50) {

            cactusX = 900;

            score += 1;
            scoreNumber.textContent = score;

            if (score % 5 === 0) {
                speed += 0.5;
            }
        }

        let dinoBottom = parseInt(
            getComputedStyle(dinosaur).bottom
        );

        let cactusLeft = cactusX;

        if (
            cactusLeft < 130 &&
            cactusLeft > 50 &&
            dinoBottom < 100
        ) {

            gameOver = true;
            message.style.display = "block";
        }

        requestAnimationFrame(gameLoop);
    }

    function restart() {

        gameOver = false;
        score = 0;
        speed = 6;
        cactusX = 900;

        scoreNumber.textContent = "0";
        message.style.display = "none";

        dinosaur.style.bottom = "55px";

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
